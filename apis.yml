name: Petcube
description: >-
  Petcube is a pet-technology company (a Y Combinator alum) that makes interactive
  Wi-Fi pet cameras and a companion mobile app for remote pet care. Its consumer
  hardware line includes the Petcube Cam, Bites treat-dispensing camera, and Play
  laser camera, offering HD video, night vision, two-way audio, motion and sound
  alerts, and app-controlled treat tossing and play. Petcube also sells the Care
  subscription (cloud video history, extended alerts) and Online Vet / Emergency
  Fund telehealth services. As of this enrichment pass Petcube exposes no public
  developer API, developer portal, or documented integration surface — the primary
  interface is the consumer iOS/Android app tied to its private cloud backend. This
  profile is maintained in the API Evangelist network as a company record.
